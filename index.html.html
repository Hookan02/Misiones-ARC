<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#17202a;--mute:#5d6b7a;--line:#d5dce3;--acc:#c77d0a;--accbg:#fbeccf;--ok:#2f7d5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#1a232d;--ink:#e7edf3;--mute:#93a3b3;--line:#2b3744;--acc:#f0b24a;--accbg:#3a2c10;--ok:#58c79a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161d;--card:#1a232d;--ink:#e7edf3;--mute:#93a3b3;--line:#2b3744;--acc:#f0b24a;--accbg:#3a2c10;--ok:#58c79a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 "Barlow Semi Condensed",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:30px;line-height:1.1;margin:0 0 4px;font-weight:700}
.sub{color:var(--mute);margin:0 0 12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 16px "Barlow Semi Condensed",sans-serif;cursor:pointer;min-height:44px}
.tab[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#101010}
.tab small{display:block;font-weight:400;font-size:13px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.tools{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;margin-bottom:10px;color:var(--mute)}
.tools label{display:flex;gap:8px;align-items:center;cursor:pointer;min-height:36px}
.tools button{background:none;border:0;color:var(--mute);text-decoration:underline;font:inherit;cursor:pointer;min-height:44px}
.q{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer}
.q input{width:26px;height:26px;flex:none;margin-top:2px;accent-color:var(--ok)}
.q.done{opacity:.5}.q.done .t{text-decoration:line-through}
.q.lock{opacity:.8;border-style:dashed}
.t{font-weight:700;font-size:19px}
.who{font-weight:600;color:var(--acc);font-size:15px}
.what{margin-top:2px}
.req{margin-top:4px;font-size:14px;color:var(--mute)}
.tag{display:inline-block;margin-top:4px;font-size:13px;background:var(--accbg);padding:1px 8px;border-radius:6px}
.empty{text-align:center;color:var(--mute);padding:24px 0}
.foot{color:var(--mute);font-size:14px;margin-top:20px}
.q{display:block;cursor:default}
.qh{display:flex;gap:12px;cursor:pointer}
.steps{margin:10px 0 0 38px;display:grid;gap:4px}
.st{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-height:32px;padding:2px 0}
.st input{width:22px;height:22px;flex:none;margin-top:0;accent-color:var(--ok)}
.st.off{opacity:.6}
.st.dn span{text-decoration:line-through;opacity:.6}
.st .tag{margin:0 0 0 4px}
</style>
</head>

<main>
<h1>Misiones por mapa</h1>
<p class="sub">137 misiones. Elige un mapa, marca cada paso que hagas y la misión se completa sola cuando terminas todos.</p>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="bar"><i id="fill"></i></div>
<div class="tools"><label><input type="checkbox" id="av" checked> Solo las que puedo hacer ya</label><label><input type="checkbox" id="hide" checked> Ocultar las hechas</label><button id="reset">Borrar marcas de este mapa</button></div>
<div id="list"></div>
<p class="foot">Nombres en inglés, como aparecen en el juego. Datos de RaiderBuddy y ARC Raiders Wiki; el juego se actualiza y puede haber misiones nuevas. Se guarda en este navegador.</p>
</main>

var done={},sd={},cur="D";
try{var s=localStorage.getItem("arc137c");done=s?JSON.parse(s):SEED}catch(e){done=SEED}
try{sd=JSON.parse(localStorage.getItem("arc137s")||"{}")}catch(e){}
function save(){try{localStorage.setItem("arc137c",JSON.stringify(done));localStorage.setItem("arc137s",JSON.stringify(sd))}catch(e){}}
function sk(n,i){return n+"#"+i}
function stepDone(n,i){return done[n]||sd[sk(n,i)]}
function setQuest(n,on){if(on)done[n]=1;else delete done[n];(STEPS[n]||[]).forEach(function(s,i){if(on)sd[sk(n,i)]=1;else delete sd[sk(n,i)]})}
function setStep(n,i,on){
 if(done[n])STEPS[n].forEach(function(s,j){sd[sk(n,j)]=1});
 if(on)sd[sk(n,i)]=1;else delete sd[sk(n,i)];
 if(STEPS[n].every(function(s,j){return sd[sk(n,j)]}))done[n]=1;else delete done[n];
}
function pre(q){return q[3]?q[3].split("|"):[]}
function ok(q){return pre(q).every(function(p){return done[p]})}
function inMap(q,m){return q[2].indexOf(m)>-1}
function draw(){
 var tabs=document.getElementById("tabs");tabs.innerHTML="";
 TABS.forEach(function(m){
  var l=Q.filter(function(q){return inMap(q,m)}),d=l.filter(function(q){return done[q[0]]}).length;
  var b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");b.setAttribute("aria-selected",m===cur);
  b.innerHTML=MP[m]+"<small>"+d+"/"+l.length+"</small>";b.onclick=function(){cur=m;draw()};tabs.appendChild(b)});
 var L=Q.filter(function(q){return inMap(q,cur)}),nd=L.filter(function(q){return done[q[0]]}).length;
 document.getElementById("fill").style.width=(100*nd/L.length)+"%";
 var av=document.getElementById("av").checked,hide=document.getElementById("hide").checked;
 var rank=function(q){return done[q[0]]?2:(ACTIVE.indexOf(q[0])>-1?-1:(ok(q)?0:1))};
 var S=L.filter(function(q){var d=done[q[0]];if(hide&&d)return false;if(av&&!d&&!ok(q))return false;return true});
 S.sort(function(a,b){return rank(a)-rank(b)});
 var list=document.getElementById("list");list.innerHTML="";
 S.forEach(function(q){
  var n=q[0],d=done[n],o=ok(q),st=STEPS[n]||[],el=document.createElement("div");
  el.className="q"+(d?" done":(o?"":" lock"));
  var miss=pre(q).filter(function(p){return !done[p]});
  var maps=q[2]==="*"?"":q[2].split("").map(function(c){return MP[c]}).join(", ");
  var nsd=st.filter(function(s,i){return stepDone(n,i)}).length;
  var h='<label class="qh"><input type="checkbox"'+(d?" checked":"")+'><div><div class="t">'+n+'</div><div class="who">'+T[q[1]]+(ACTIVE.indexOf(n)>-1&&!d?" · en curso":"")+'</div>'+(st.length?"":'<div class="what">'+q[4]+'</div>')+(miss.length&&!d?'<div class="req">Antes: '+miss.join(", ")+'</div>':"")+(q[2].length>1&&q[2]!=="*"?'<span class="tag">Se hace en: '+maps+'</span> ':"")+(st.length?'<span class="tag">Pasos '+nsd+'/'+st.length+'</span>':"")+'</div></label>';
  var idx=st.map(function(s,i){return i});
  idx.sort(function(a,b){var ra=(st[a][0]===cur||st[a][0]==="*")?0:1,rb=(st[b][0]===cur||st[b][0]==="*")?0:1;return ra-rb||a-b});
  if(st.length)h+='<div class="steps">'+idx.map(function(i){var s=st[i],dn=stepDone(n,i),here=s[0]===cur||s[0]==="*";return '<label class="st'+(dn?" dn":"")+(here?"":" off")+'"><input type="checkbox" data-i="'+i+'"'+(dn?" checked":"")+'><span>'+s[1]+(here?"":' <b class="tag">'+MP[s[0]]+'</b>')+'</span></label>'}).join("")+'</div>';
  el.innerHTML=h;
  el.querySelector(".qh input").onchange=function(e){setQuest(n,e.target.checked);save();draw()};
  el.querySelectorAll(".st input").forEach(function(c){c.onchange=function(e){setStep(n,+c.getAttribute("data-i"),e.target.checked);save();draw()}});
  list.appendChild(el);
 });
 if(!S.length)list.innerHTML='<div class="empty">'+(nd===L.length?"Todo hecho en este mapa.":"No hay misiones disponibles ahora aquí. Quita el filtro para ver las bloqueadas.")+'</div>';
}
document.getElementById("av").onchange=draw;document.getElementById("hide").onchange=draw;
document.getElementById("reset").onclick=function(){Q.forEach(function(q){if(inMap(q,cur))setQuest(q[0],false)});save();draw()};
draw();
</script>
